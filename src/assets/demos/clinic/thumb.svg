<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img"
     aria-label="Preview of the clinic template: an availability grid on a stone background">
  <rect width="480" height="300" fill="#eaefec"/>

  <!-- header bar -->
  <rect x="0" y="0" width="480" height="34" fill="#eaefec"/>
  <line x1="0" y1="34" x2="480" y2="34" stroke="#12302a" stroke-opacity="0.16"/>
  <rect x="24" y="11" width="13" height="13" fill="#12302a"/>
  <rect x="44" y="14" width="66" height="7" fill="#12302a" opacity="0.55"/>
  <rect x="330" y="14" width="30" height="6" fill="#12302a" opacity="0.28"/>
  <rect x="368" y="14" width="30" height="6" fill="#12302a" opacity="0.28"/>
  <rect x="406" y="9" width="50" height="17" fill="#12302a"/>

  <!-- headline -->
  <rect x="24" y="66" width="150" height="15" fill="#12302a"/>
  <rect x="24" y="88" width="128" height="15" fill="#12302a"/>
  <rect x="24" y="110" width="96" height="15" fill="#12302a"/>
  <rect x="24" y="142" width="150" height="6" fill="#12302a" opacity="0.35"/>
  <rect x="24" y="154" width="120" height="6" fill="#12302a" opacity="0.35"/>
  <rect x="24" y="180" width="76" height="22" fill="#4338a8"/>

  <!-- availability grid -->
  <line x1="212" y1="62" x2="456" y2="62" stroke="#12302a" stroke-width="1.5"/>
  <rect x="212" y="70" width="60" height="7" fill="#12302a" opacity="0.5"/>

  <line x1="212" y1="88" x2="456" y2="88" stroke="#12302a" stroke-opacity="0.16"/>
  <g fill="#12302a" opacity="0.4">
    <rect x="252" y="94" width="16" height="5"/>
    <rect x="292" y="94" width="16" height="5"/>
    <rect x="332" y="94" width="16" height="5"/>
    <rect x="372" y="94" width="16" height="5"/>
    <rect x="412" y="94" width="16" height="5"/>
  </g>
  <line x1="212" y1="106" x2="456" y2="106" stroke="#12302a" stroke-opacity="0.38"/>

  <!-- rows -->
  <g>
    <rect x="212" y="114" width="30" height="5" fill="#12302a" opacity="0.35"/>
    <rect x="288" y="112" width="26" height="16" fill="#4338a8" opacity="0.22" stroke="#4338a8" stroke-opacity="0.5"/>
    <rect x="368" y="112" width="26" height="16" fill="#4338a8" opacity="0.22" stroke="#4338a8" stroke-opacity="0.5"/>
    <line x1="212" y1="136" x2="456" y2="136" stroke="#12302a" stroke-opacity="0.16"/>

    <rect x="212" y="144" width="30" height="5" fill="#12302a" opacity="0.35"/>
    <rect x="248" y="142" width="26" height="16" fill="#4338a8" opacity="0.22" stroke="#4338a8" stroke-opacity="0.5"/>
    <rect x="408" y="142" width="26" height="16" fill="#4338a8" opacity="0.22" stroke="#4338a8" stroke-opacity="0.5"/>
    <line x1="212" y1="166" x2="456" y2="166" stroke="#12302a" stroke-opacity="0.16"/>

    <rect x="212" y="174" width="30" height="5" fill="#12302a" opacity="0.35"/>
    <rect x="328" y="172" width="26" height="16" fill="#4338a8" opacity="0.22" stroke="#4338a8" stroke-opacity="0.5"/>
    <line x1="212" y1="196" x2="456" y2="196" stroke="#12302a" stroke-opacity="0.16"/>
  </g>

  <!-- fact strip -->
  <line x1="0" y1="228" x2="480" y2="228" stroke="#12302a" stroke-opacity="0.38"/>
  <rect x="0" y="228" width="480" height="72" fill="#f6faf8"/>
  <g fill="#12302a">
    <rect x="24" y="248" width="52" height="9"/>
    <rect x="24" y="264" width="76" height="5" opacity="0.35"/>
    <rect x="140" y="248" width="66" height="9"/>
    <rect x="140" y="264" width="76" height="5" opacity="0.35"/>
    <rect x="256" y="248" width="48" height="9"/>
    <rect x="256" y="264" width="76" height="5" opacity="0.35"/>
    <rect x="372" y="248" width="44" height="9"/>
    <rect x="372" y="264" width="76" height="5" opacity="0.35"/>
  </g>
  <line x1="128" y1="228" x2="128" y2="300" stroke="#12302a" stroke-opacity="0.16"/>
  <line x1="244" y1="228" x2="244" y2="300" stroke="#12302a" stroke-opacity="0.16"/>
  <line x1="360" y1="228" x2="360" y2="300" stroke="#12302a" stroke-opacity="0.16"/>
</svg>
