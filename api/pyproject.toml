[project]
name = "lracdimension-api"
version = "1.0.0"
description = "LRACDIMENSION API: website engine (Vector, Signal, Forge), intake, studio workflow, and the Git-backed CMS."
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 180
target-version = "py311"
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
# Pragmatic set: real errors, unused imports, import order. Not a style war.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# B904: inside an `except`, the API raises ApiError deliberately without
#   chaining, so clients never see an internal cause.
# B008/E741/B005/B905: noise for this codebase's style.
ignore = ["B008", "B904", "E741", "B005", "B905"]

[tool.ruff.lint.per-file-ignores]
# Tests import fixtures after setting environment variables on purpose.
"tests/*" = ["E402"]
"alembic/env.py" = ["E402"]
# The analyzer tests define a tiny helper inline next to the assertions it serves.
"tests/test_analyzers.py" = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
